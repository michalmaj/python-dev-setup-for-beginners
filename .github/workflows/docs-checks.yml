name: Documentation checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_markdown_links.rb"
      - ".github/workflows/docs-checks.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/check_markdown_links.rb"
      - ".github/workflows/docs-checks.yml"

permissions:
  contents: read

jobs:
  local-links:
    name: Local Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check local links and headings
        run: ruby scripts/check_markdown_links.rb
