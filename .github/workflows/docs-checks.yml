name: Documentation checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_markdown_links.rb"
      - ".github/**/*.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/check_markdown_links.rb"
      - ".github/**/*.yml"

permissions:
  contents: read

jobs:
  local-links:
    name: Local Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check local links and headings
        run: ruby scripts/check_markdown_links.rb

      - name: Check YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/**/*.yml"].sort.each { |file| YAML.parse_file(file); puts "Valid YAML: #{file}" }'
